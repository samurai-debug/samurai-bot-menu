<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var link = "https://t.me/mycursorbot_bot?start=menu";
      var path = "/mycursorbot_bot?start=menu";
      function post(eventType, eventData) {
        var data = eventData || {};
        try {
          if (window.TelegramWebviewProxy && TelegramWebviewProxy.postEvent) {
            TelegramWebviewProxy.postEvent(eventType, JSON.stringify(data));
            return;
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(JSON.stringify({ eventType: eventType, eventData: data }), "*");
          }
        } catch (e) {}
      }
      function run() {
        post("web_app_open_tg_link", { path: path });
        try {
          var tg = window.Telegram && Telegram.WebApp;
          if (tg) {
            tg.ready();
            tg.openTelegramLink(link);
            tg.close();
          }
        } catch (e) {}
        post("web_app_close", {});
      }
      run();
      setTimeout(run, 30);
    })();
  </script>
</head>
<body></body>
</html>
