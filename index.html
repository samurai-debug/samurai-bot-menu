<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var path = "/mycursorbot_bot?start=menu";
      var link = "https://t.me" + path;
      function post(eventType, eventData) {
        var data = eventData || {};
        try {
          if (window.TelegramWebviewProxy && TelegramWebviewProxy.postEvent) {
            TelegramWebviewProxy.postEvent(eventType, JSON.stringify(data));
            return;
          }
        } catch (e) {}
        try {
          if (window.external && typeof window.external.notify === "function") {
            window.external.notify(JSON.stringify({ eventType: eventType, eventData: data }));
            return;
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(JSON.stringify({ eventType: eventType, eventData: data }), "*");
          }
        } catch (e) {}
      }
      function run() {
        post("web_app_open_tg_link", { path: path });
        post("web_app_close", {});
        try {
          var tg = window.Telegram && Telegram.WebApp;
          if (!tg) return;
          try { tg.openTelegramLink(link); } catch (e) {}
          try { tg.close(); } catch (e) {}
        } catch (e) {}
      }
      run();
      setTimeout(run, 0);
      setTimeout(run, 20);
    })();
  </script>
</head>
<body></body>
</html>
